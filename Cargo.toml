[package]
name = "glb-viewer"
version = "0.1.0"
edition = "2024"
description = "A lightweight cross-platform GLB inspection desktop app"
license = "MIT"
default-run = "glb-viewer"

[dependencies]
anyhow = "1"
gltf = { version = "1.4", features = ["KHR_materials_unlit"] }
macroquad = { version = "0.4.14", default-features = false, features = ["log-rs"] }
miniquad = "0.4"
rfd = "0.15"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "debuginfo"
